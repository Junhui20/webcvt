name: Release (npm)

# Publishes all public @catlabtech/webcvt-* packages to npm when a version tag
# (e.g. v0.1.0) is pushed. Private packages (apps, examples, test-utils) are
# skipped automatically by `pnpm -r publish`.
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   NPM_TOKEN — a granular npm token with ALL THREE of:
#     1. "Read and write" permission on the @catlabtech scope / packages
#        (read-only or wrong scope → publish fails with 404 "not in registry").
#     2. "Bypass 2FA" enabled (the account enforces 2FA; without bypass the
#        publish fails with 403 "two-factor authentication ... is required").
#        A classic "Automation" token satisfies this by design.
#   Issued from an account that is a member of the @catlabtech org with publish
#   rights. (Learned the hard way during the v0.2.0 release: 403 → 404 → success.)
#
# Package names also pass npm's content filter: avoid keyword-stuffed names
# (e.g. ...-doc-ebook-epub triggered E400 "That word is not allowed"; it was
# renamed to @catlabtech/webcvt-epub).
#
# NEVER paste a token into source, a prompt, or a commit — only into the
# encrypted GitHub secret above.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, test & publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          # setup-node writes an .npmrc that reads NODE_AUTH_TOKEN — the token
          # is never materialised into the repo.
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # `pnpm -r publish` only publishes non-private packages whose version is
      # not already on the registry; --no-git-checks is required in CI.
      - run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
